<?xml version="1.0" encoding="UTF-8"?>
<!-- Tarn — Mark + wordmark, dark background, no descriptor. For compact
     placements (nav headers) where the full lockup's descriptor line
     would render illegibly small. VerifiHouse LLC. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Tarn">
  <title>Tarn</title>

  <!-- Mark: peaks + reflection, left side -->
  <g transform="translate(30, 20) scale(0.7)">
    <g fill="#FEF9EE">
      <polygon points="70,150 158,62 232,150" />
      <polygon points="198,150 265,22 356,150" />
    </g>
    <rect x="55" y="150" width="316" height="3" fill="#FEF9EE" />
    <g fill="#64748B">
      <polygon points="70,153 158,241 232,153" />
      <polygon points="198,153 265,281 356,153" />
    </g>
  </g>

  <!-- Wordmark, right side -->
  <g transform="translate(340, 0)">
    <text
      x="0"
      y="150"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="140"
      font-weight="500"
      letter-spacing="-3"
      fill="#FEF9EE">tarn</text>
  </g>
</svg>
